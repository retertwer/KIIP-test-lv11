<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIIP Level 4 Lesson 11 Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', 'Noto Sans KR', sans-serif; background-color: #f0f2f5; }

        .korean-font { font-family: 'Noto Sans KR', sans-serif; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .correct { background-color: #d1fae5 !important; border-color: #10b981 !important; color: #065f46 !important; }
        .incorrect { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; }
        .power-up-active { filter: grayscale(0.5); opacity: 0.7; pointer-events: none; }

</head>
<body class="p-2 md:p-4">
    <div id="app" class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden min-h-[90vh] flex flex-col">
        <!-- Start Screen -->
        <div id="start-screen" class="p-8 flex flex-col items-center justify-center flex-grow text-center">
            <div class="w-24 h-24 bg-blue-600 rounded-full flex items-center justify-center text-white text-4xl mb-6 shadow-lg">
                <i class="fas fa-shield-alt"></i>
            </div>
            <h1 class="text-3xl font-bold mb-4 text-gray-800">KIIP កម្រិត ៤ - មេរៀនទី ១១</h1>
            <p class="text-gray-600 mb-8 khmer-font">វិញ្ញាសាសាកល្បងត្រៀមប្រឡង 중간평가<br>ប្រធានបទ៖ <b>សុវត្ថិភាព និងគ្រោះមហន្តរាយ (생활 안전)</b></p>
            <button onclick="quizManager.start()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-12 rounded-full text-xl transition-all shadow-md transform hover:scale-105">
                ចាប់ផ្ដើមធ្វើតេស្ត
            </button>
            <p class="mt-6 text-sm text-gray-400 italic">មាន ៣០ សំណួរ • វេយ្យាករណ៍ • ការអាន • វប្បធម៌</p>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden flex-grow flex flex-col">
            <!-- Header -->
            <div class="bg-blue-600 p-4 text-white">
                <div class="flex justify-between items-center mb-2">
                    <span id="question-index" class="font-bold text-lg">សំណួរទី 1/30</span>
                    <div class="flex gap-3">
                        <button id="btn-audio-ko" onclick="audioManager.speakCurrent('ko')" class="bg-white/20 hover:bg-white/30 px-3 py-2 rounded-lg transition-colors flex items-center gap-2" title="Listen Korean">
                            🇰🇷 <i class="fas fa-volume-up"></i>
                        </button>
                        <button id="btn-audio-km" onclick="audioManager.speakCurrent('km')" class="bg-white/20 hover:bg-white/30 px-3 py-2 rounded-lg transition-colors flex items-center gap-2" title="Listen Khmer">
                            🇰🇭 <i class="fas fa-volume-up"></i>
                        </button>
                    </div>
                </div>
                <div class="w-full bg-blue-900/30 h-2 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-yellow-400 h-full transition-all duration-300" style="width: 3%"></div>
                </div>
            </div>

            <!-- Content Area -->
            <div class="p-4 md:p-6 flex-grow overflow-y-auto">
                <!-- Power-ups -->
                <div id="power-ups" class="flex gap-2 mb-4">
                    <button id="pu-translate-q" onclick="quizManager.usePowerUp('translateQ')" class="flex-1 bg-gray-100 hover:bg-gray-200 text-xs py-2 px-1 rounded-lg text-gray-700 border border-gray-300">
                        <i class="fas fa-language"></i> បកប្រែសំណួរ
                    </button>
                    <button id="pu-fifty" onclick="quizManager.usePowerUp('fifty')" class="flex-1 bg-gray-100 hover:bg-gray-200 text-xs py-2 px-1 rounded-lg text-gray-700 border border-gray-300">
                        <i class="fas fa-divide"></i> កាត់ ៥០/៥០
                    </button>
                    <button id="pu-translate-a" onclick="quizManager.usePowerUp('translateA')" class="flex-1 bg-gray-100 hover:bg-gray-200 text-xs py-2 px-1 rounded-lg text-gray-700 border border-gray-300">
                        <i class="fas fa-list-ul"></i> បកប្រែចម្លើយ
                    </button>
                </div>

                <!-- Question Text -->
                <div id="question-container" class="mb-6 fade-in">
                    <div id="question-text-ko" class="text-xl font-bold text-gray-800 korean-font leading-relaxed"></div>
                    <div id="question-text-km" class="hidden text-md mt-2 text-blue-700 khmer-font font-medium bg-blue-50 p-3 rounded-lg border-l-4 border-blue-400 italic"></div>
                </div>

                <!-- Options -->
                <div id="options-container" class="space-y-3 mb-6"></div>

                <!-- Explanation Box -->
                <div id="explanation-box" class="hidden fade-in bg-yellow-50 border border-yellow-200 rounded-xl p-4 mb-6">

                        <i class="fas fa-lightbulb"></i> ការពន្យល់លម្អិត
                    </h3>
                    <div id="explanation-content" class="text-sm text-gray-700 space-y-3"></div>
                </div>
            </div>

            <!-- Footer Action -->
            <div class="p-4 border-t bg-gray-50 flex justify-between items-center">
                <div class="text-sm font-bold">ពិន្ទុ: <span id="score" class="text-blue-600">0</span></div>
                <button id="next-btn" onclick="quizManager.next()" class="hidden bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-bold transition-all shadow-md">
                    សំណួរបន្ទាប់ <i class="fas fa-arrow-right ml-2"></i>
                </button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden p-8 flex flex-col items-center justify-center flex-grow text-center">
            <div id="result-icon" class="text-6xl mb-4">🏆</div>

            <p id="result-score-text" class="text-xl mb-6 text-gray-600"></p>
            <div class="space-y-3 w-full max-w-xs">
                <button onclick="location.reload()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold shadow-md">ធ្វើម្ដងទៀត</button>
                <button onclick="quizManager.startReview()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold shadow-md">ឆែកមើលចម្លើយឡើងវិញ</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                q_ko: "다음 빈칸에 알맞은 것을 고르십시오.\n\n길을 걷다가 갑자기 지진이 나면 가방이나 손으로 (   )을/를 보호해야 한다.",
                q_km: "ប្រសិនបើមានការរញ្ជួយដីកើតឡើងភ្លាមៗពេលកំពុងដើរតាមផ្លូវ អ្នកត្រូវតែការពារ ( ) ដោយដៃ ឬកាបូប។",
                options: ["머리", "다리", "어깨", "허리"],
                options_km: ["ក្បាល", "ជើង", "ស្មា", "ចង្កេះ"],
                correct: 0,
                explanation: {
                    desc: "ក្នុងករណីរញ្ជួយដី ក្បាល (머리) គឺជាផ្នែកដែលសំខាន់បំផុតដែលត្រូវការពារពីការធ្លាក់មកនៃកម្ទេចកម្ទី។",

                }
            },
            {
                q_ko: "다음 중 밑줄 친 부분과 의미가 비슷한 것을 고르십시오.\n\n불이 났을 때는 당황하지 말고 119에 <u>신고해야</u> 합니다.",
                q_km: "នៅពេលមានភ្លើងឆេះ កុំស្លន់ស្លោអី ត្រូវតែ (រាយការណ៍) ទៅលេខ ១១៩។",
                options: ["연락해야", "조심해야", "알려야", "구해야"],

                correct: 2,
                explanation: {
                    desc: "신고하다 (រាយការណ៍) មានន័យប្រហាក់ប្រហែលនឹង 알리다 (ប្រាប់/ជូនដំណឹង) ក្នុងបរិបទប្រាប់អាជ្ញាធរពីហេតុការណ៍អ្វីមួយ។",

                options: ["멈추면", "움직이면", "열리면", "닫히면"],

                    vocab: [{ko: "비상 벨", km: "ប៊ូតុងអាសន្ន"}]
                }
            },
            {
                q_ko: "비가 너무 많이 와서 집이 (   ) 정도로 홍수가 났다.",
                q_km: "ភ្លៀងធ្លាក់ខ្លាំងពេក រហូតដល់ថ្នាក់ផ្ទះ ( ) គឺមានទឹកជំនន់កើតឡើង។",

                options: ["숨겨야", "알려야", "말해야", "물어야"],
                options_km: ["លាក់បាំង", "ជូនដំណឹង", "និយាយ", "សួរ"],
                correct: 0,
                explanation: {

                    vocab: [{ko: "목격하다", km: "ឃើញនឹងភ្នែក"}, {ko: "현장", km: "កន្លែងកើតហេតុ"}]

            {

                options: ["매지 않으면", "매느라고", "매는 바람에", "매자마자"],

                correct: 0,
                explanation: {

                explanation: {
                    desc: "미끄럽다 (រអិល)។",
                    vocab: [{ko: "넘어지다", km: "ដួល"}, {ko: "조심하다", km: "ប្រុងប្រយ័ត្ន"}]
                }
            }
        ];

        let state = {
            currentIdx: 0,
            score: 0,
            isAnswered: false,
            powerUps: { translateQ: false, fifty: false, translateA: false },
            answers: []
        };

        const audioManager = {
            isSpeaking: false,
            speak: function(text, lang) {
                if (this.isSpeaking) {
                    window.speechSynthesis.cancel();
                    this.isSpeaking = false;
                    this.updateIcon(false);
                    return;
                }

                // Try Google TTS first via Audio Object
                const googleUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=${lang}&client=tw-ob`;
                const audio = new Audio(googleUrl);
                
                audio.onplaying = () => { 
                    this.isSpeaking = true; 
                    this.updateIcon(true, lang); 
                };
                audio.onended = () => { 
                    this.isSpeaking = false; 
                    this.updateIcon(false); 
                };
                
                audio.play().catch(() => {
                    // Fallback to Web Speech API if Google TTS is blocked
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = lang === 'ko' ? 'ko-KR' : 'km-KH';
                    
                    // Try to find a natural voice
                    const voices = window.speechSynthesis.getVoices();
                    const voice = voices.find(v => v.lang.startsWith(lang));
                    if (voice) utterance.voice = voice;

                    utterance.onstart = () => { 
                        this.isSpeaking = true; 
                        this.updateIcon(true, lang); 
                    };
                    utterance.onend = () => { 
                        this.isSpeaking = false; 
                        this.updateIcon(false); 
                    };
                    window.speechSynthesis.speak(utterance);
                });
            },
            speakCurrent: function(lang) {
                const q = questions[state.currentIdx];
                const text = lang === 'ko' ? q.q_ko : q.q_km;
                this.speak(text, lang);
            },
            updateIcon: function(playing, lang) {
                const btn = document.getElementById(lang === 'ko' ? 'btn-audio-ko' : 'btn-audio-km');
                const otherBtn = document.getElementById(lang === 'ko' ? 'btn-audio-km' : 'btn-audio-ko');
                
                if (playing) {
                    btn.classList.add('audio-playing');
                    btn.innerHTML = lang === 'ko' ? '🇰🇷 <i class="fas fa-stop"></i>' : '🇰🇭 <i class="fas fa-stop"></i>';
                } else {
                    document.getElementById('btn-audio-ko').classList.remove('audio-playing');
                    document.getElementById('btn-audio-km').classList.remove('audio-playing');
                    document.getElementById('btn-audio-ko').innerHTML = '🇰🇷 <i class="fas fa-volume-up"></i>';
                    document.getElementById('btn-audio-km').innerHTML = '🇰🇭 <i class="fas fa-volume-up"></i>';
                }
            }
        };

        const quizManager = {
            start: function() {
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('quiz-screen').classList.remove('hidden');
                this.renderQuestion();
            },
            renderQuestion: function() {
                const q = questions[state.currentIdx];
                state.isAnswered = false;
                window.speechSynthesis.cancel();
                
                document.getElementById('question-index').innerText = `សំណួរទី ${state.currentIdx + 1}/${questions.length}`;
                document.getElementById('progress-bar').style.width = `${((state.currentIdx + 1) / questions.length) * 100}%`;
                
                document.getElementById('question-text-ko').innerText = q.q_ko;
                document.getElementById('question-text-km').innerText = q.q_km;
                document.getElementById('question-text-km').classList.add('hidden');
                
                this.resetPowerUpsUI();

                const container = document.getElementById('options-container');
                container.innerHTML = '';
                q.options.forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.className = "w-full p-4 text-left border-2 border-gray-200 rounded-xl hover:border-blue-400 hover:bg-blue-50 transition-all korean-font font-medium flex justify-between items-center group";
                    btn.innerHTML = `
                        <span>${i + 1}. ${opt}</span>
                        <span class="option-km hidden text-sm text-blue-600 khmer-font font-normal ml-2 italic">(${q.options_km[i]})</span>
                    `;
                    btn.onclick = () => this.checkAnswer(i);
                    container.appendChild(btn);
                });

                document.getElementById('explanation-box').classList.add('hidden');
                document.getElementById('next-btn').classList.add('hidden');
            },
            checkAnswer: function(selected) {
                if (state.isAnswered) return;
                state.isAnswered = true;
                const q = questions[state.currentIdx];
                const isCorrect = selected === q.correct;
                
                if (isCorrect) {
                    state.score++;
                    document.getElementById('score').innerText = state.score;
                }

                state.answers.push({ qIdx: state.currentIdx, selected, isCorrect });

                const buttons = document.getElementById('options-container').children;
                buttons[q.correct].classList.add('correct');
                if (!isCorrect) buttons[selected].classList.add('incorrect');

                this.revealAll();
            },
            revealAll: function() {
                document.getElementById('question-text-km').classList.remove('hidden');
                document.querySelectorAll('.option-km').forEach(el => el.classList.remove('hidden'));
                this.showExplanation();
                document.getElementById('next-btn').classList.remove('hidden');
            },
            showExplanation: function() {
                const q = questions[state.currentIdx];
                const content = document.getElementById('explanation-content');
                
                let vocabHtml = q.explanation.vocab.map(v => 
                    `<div class="flex items-center justify-between bg-white p-2 rounded border border-yellow-100">
                        <span class="font-bold text-blue-800 korean-font">${v.ko}</span>
                        <div class="flex items-center gap-2">
                            <span class="text-gray-600 khmer-font text-xs">${v.km}</span>
                            <button onclick="audioManager.speak('${v.ko}', 'ko')" class="text-xs text-blue-400"><i class="fas fa-volume-up"></i></button>
                        </div>
                    </div>`
                ).join('');

                content.innerHTML = `<p class="khmer-font leading-relaxed">${q.explanation.desc}</p><div class="grid grid-cols-2 gap-2 mt-3">${vocabHtml}</div>`;
                document.getElementById('explanation-box').classList.remove('hidden');
            },
            usePowerUp: function(type) {
                if (state.isAnswered) return;
                const q = questions[state.currentIdx];
                if (type === 'translateQ') {
                    document.getElementById('question-text-km').classList.remove('hidden');
                    document.getElementById('pu-translate-q').classList.add('power-up-active');
                } else if (type === 'fifty') {
                    const buttons = document.getElementById('options-container').children;
                    let removed = 0;
                    for (let i = 0; i < buttons.length; i++) {
                        if (i !== q.correct && removed < 2) {
                            buttons[i].style.opacity = '0.3';
                            buttons[i].onclick = null;
                            removed++;
                        }
                    }
                    document.getElementById('pu-fifty').classList.add('power-up-active');
                } else if (type === 'translateA') {
                    document.querySelectorAll('.option-km').forEach(el => el.classList.remove('hidden'));
                    document.getElementById('pu-translate-a').classList.add('power-up-active');
                }
            },
            resetPowerUpsUI: function() {
                ['pu-translate-q', 'pu-fifty', 'pu-translate-a'].forEach(id => document.getElementById(id).classList.remove('power-up-active'));
            },
            next: function() {
                state.currentIdx++;
                if (state.currentIdx < questions.length) this.renderQuestion();
                else this.showResult();
            },
            showResult: function() {
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('result-score-text').innerHTML = `អ្នកឆ្លើយត្រូវ <b>${state.score}/${questions.length}</b> សំណួរ`;
            },
            startReview: function() {
                state.currentIdx = 0;
                document.getElementById('result-screen').classList.add('hidden');
                document.getElementById('quiz-screen').classList.remove('hidden');
                this.renderReviewQuestion();
            },
            renderReviewQuestion: function() {
                this.renderQuestion();
                const record = state.answers[state.currentIdx];
                this.checkAnswer(record.selected);
                const nextBtn = document.getElementById('next-btn');
                if (state.currentIdx === questions.length - 1) {
                    nextBtn.innerText = "ត្រលប់ទៅលទ្ធផល";
                    nextBtn.onclick = () => { document.getElementById('quiz-screen').classList.add('hidden'); document.getElementById('result-screen').classList.remove('hidden'); };
                } else {
                    nextBtn.onclick = () => { state.currentIdx++; this.renderReviewQuestion(); };
                }
            }
        };

        // Initialize voices
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    </script>
</body>
</html>
